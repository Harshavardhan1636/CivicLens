services:
  app:
    build: .
    container_name: civiclens-app
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - civiclens-data:/app/data
    environment:
      - PORT=5000
      - DATABASE_PATH=/app/data/civiclens.db
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  civiclens-data:
